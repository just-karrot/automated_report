<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #F2EDE4;
            --dark: #1A1A1A;
            --accent: #B34632;
            --input-bg: #EBE4D8;
            --border: #1A1A1A;
            --text-muted: #6B665E;
            --text-body: #3A3732;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 420px;
            min-width: 320px;
            max-width: 85vw;
            padding: 28px 24px;
            overflow-y: auto;
            overflow-x: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg);
            resize: horizontal;
        }

        .sidebar::-webkit-scrollbar { width: 4px; height: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .brand-mark {
            width: 28px;
            height: 28px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-mark span {
            color: var(--bg);
            font-weight: 700;
            font-size: 14px;
        }
        .brand h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .brand-sub {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        /* ── FORM ELEMENTS ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        input, textarea, select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--dark);
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
        }
        textarea { resize: vertical; min-height: 72px; }

        /* ── CATEGORY TOGGLE ── */
        .category-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .toggle-row {
            display: flex;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px 0;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--dark);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
        }
        .toggle-btn + .toggle-btn { border-left: none; }
        .toggle-btn.active {
            background: var(--dark);
            color: var(--bg);
        }
        .toggle-btn:hover:not(.active) {
            background: rgba(26,26,26,0.06);
        }

        /* ── BUTTONS ── */
        .btn-generate {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 0;
            background: var(--accent);
            color: var(--bg);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-generate:hover { opacity: 0.88; }
        .btn-generate:disabled {
            background: var(--text-muted);
            cursor: wait;
        }

        .actions {
            display: flex;
            gap: 0;
            margin-top: 4px;
        }
        .btn-action {
            flex: 1;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            color: var(--dark);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-action + .btn-action { border-left: none; }
        .btn-action:hover {
            background: var(--dark);
            color: var(--bg);
        }

        /* ── DIVIDER ── */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--dark);
            margin-top: 4px;
        }

        /* ── COLLAPSIBLE SECTIONS ── */
        .collapse-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 8px 0;
            user-select: none;
        }
        .collapse-header .arrow {
            font-size: 10px;
            transition: transform 0.2s;
            color: var(--text-muted);
        }
        .collapse-header.open .arrow { transform: rotate(90deg); }
        .collapse-body {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .collapse-body.open { display: flex; }

        /* ── PREVIEW PANEL ── */
        .preview {
            flex: 1;
            background: var(--dark);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }
        .preview iframe {
            width: 21cm;
            height: 29.7cm;
            background: white;
            border: none;
            box-shadow: 0 2px 40px rgba(0,0,0,0.4);
            transform: scale(0.75);
            transform-origin: top center;
        }

        /* ── MOBILE RESPONSIVE ── */
        @media (max-width: 850px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .sidebar {
                width: 100% !important;
                min-width: 100%;
                max-width: 100%;
                height: auto;
                resize: none;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 20px 16px;
                overflow-x: hidden;
            }
            .preview {
                padding: 12px;
                min-height: 100vh;
                overflow-x: hidden;
            }
            .preview iframe {
                transform: scale(0.45);
                transform-origin: top center;
                max-width: 100%;
            }
            .brand h1 { font-size: 16px; }
            .toggle-btn { font-size: 10px; }
        }

        /* ── HIDDEN ── */
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <!-- Brand -->
    <div class="brand">
        <div class="brand-mark"><span>R</span></div>
        <h1>Report Generator</h1>
    </div>
    <div class="brand-sub">AI-Powered Event Reporting</div>

    <!-- API Key -->
    <div class="form-group">
        <label>Groq API Key</label>
        <input type="password" id="apiKey" placeholder="Enter API Key">
    </div>

    <!-- Report Format Toggle -->
    <div class="category-group">
        <label>Report Format</label>
        <div class="toggle-row">
            <button class="toggle-btn active" data-format="event_report" onclick="selectFormat(this)">Event Report</button>
            <button class="toggle-btn" data-format="project_report" onclick="selectFormat(this)">Project Report</button>
        </div>
        <input type="hidden" id="reportFormat" value="event_report">
    </div>

    <!-- Event Specific Inputs -->
    <div id="eventInputs">
        <!-- Event Category Toggle -->
        <div class="category-group">
            <label>Event Category</label>
            <div class="toggle-row">
                <button class="toggle-btn active" data-cat="technical" onclick="selectCategory(this)">Technical</button>
                <button class="toggle-btn" data-cat="cultural" onclick="selectCategory(this)">Cultural</button>
                <button class="toggle-btn" data-cat="sports" onclick="selectCategory(this)">Sports</button>
            </div>
            <input type="hidden" id="eventCategory" value="technical">
        </div>

        <div class="form-group">
            <label>Event Description</label>
            <textarea id="eventDescription" placeholder="Describe the event in detail: name, date, organizers, flow, speakers, key highlights..." style="min-height: 110px;"></textarea>
        </div>
    </div>

    <!-- Project Specific Inputs -->
    <div id="projectInputs" class="hidden">
        <div class="form-group">
            <label>Project Description</label>
            <textarea id="projectDescription" placeholder="Describe your project: title, objectives, methodology, system design, results..." style="min-height: 140px;"></textarea>
        </div>
        <div class="form-group">
            <label>Student Details (CSV: Name, RegNo, RollNo)</label>
            <textarea id="studentDetails" placeholder="Student A, PCE22CA001, 101&#10;Student B, PCE22CA002, 102"></textarea>
        </div>
    </div>

    <!-- Generate Button -->
    <button class="btn-generate" id="genBtn" onclick="generateAll()">Generate Full Report</button>

    <div class="divider"></div>

    <!-- Editable Fields (collapsed by default) -->
    <div class="collapse-header" onclick="toggleSection(this)">
        <span class="section-label">Edit Generated Content</span>
        <span class="arrow">▶</span>
    </div>
    <div class="collapse-body">
        <!-- Event Edit Fields -->
        <div id="eventEditFields">
            <div class="form-group"><label>Event Name</label><input type="text" id="event_name"></div>
            <div class="form-group"><label>Date</label><input type="text" id="event_date"></div>
            <div class="form-group"><label>Duration</label><input type="text" id="event_duration"></div>
            <div class="form-group"><label>Activity Type</label><input type="text" id="event_type"></div>
            <div class="form-group"><label>Organized By</label><input type="text" id="organized_by"></div>
            <div class="form-group"><label>Coordinators</label><textarea id="coordinators"></textarea></div>
            <div class="form-group"><label>Introduction</label><textarea id="introduction"></textarea></div>
            <div class="form-group"><label>Event Details</label><textarea id="details_of_the_event"></textarea></div>
            <div class="form-group"><label>Event Description</label><textarea id="description_of_the_event"></textarea></div>
            <div class="form-group"><label>Beneficiaries</label><input type="text" id="beneficiaries"></div>
            <div class="form-group"><label>Session Overview</label><textarea id="session_overview"></textarea></div>
            <div class="form-group"><label>Conclusion</label><textarea id="conclusion"></textarea></div>
        </div>

        <!-- Project Edit Fields -->
        <div id="projectEditFields" class="hidden">
            <div class="form-group"><label>Project Title</label><input type="text" id="proj_title"></div>
            <div class="form-group"><label>Project Type</label><input type="text" id="proj_type"></div>
            <div class="form-group"><label>Branch</label><input type="text" id="proj_branch"></div>
            <div class="form-group"><label>Session</label><input type="text" id="proj_session"></div>
            <div class="form-group"><label>Supervisor Name</label><input type="text" id="proj_prof"></div>
            <div class="form-group"><label>Supervisor Designation</label><input type="text" id="proj_desig"></div>
            <div class="form-group"><label>Abstract Title</label><input type="text" id="proj_abs_title"></div>
            <div class="form-group"><label>Abstract Content</label><textarea id="proj_abs_content"></textarea></div>
            <div class="form-group"><label>Keywords</label><input type="text" id="proj_keywords"></div>
            <div class="form-group"><label>Chapter 1 Title</label><input type="text" id="ch1_title"></div>
            <div class="form-group"><label>Chapter 1 Content</label><textarea id="ch1_content"></textarea></div>
            <div class="form-group"><label>Chapter 2 Title</label><input type="text" id="ch2_title"></div>
            <div class="form-group"><label>Chapter 2 Content</label><textarea id="ch2_content"></textarea></div>
            <div class="form-group"><label>Chapter 3 Title</label><input type="text" id="ch3_title"></div>
            <div class="form-group"><label>Chapter 3 Content</label><textarea id="ch3_content"></textarea></div>
            <div class="form-group"><label>Chapter 4 Title</label><input type="text" id="ch4_title"></div>
            <div class="form-group"><label>Chapter 4 Content</label><textarea id="ch4_content"></textarea></div>
            <div class="form-group"><label>Chapter 5 Title</label><input type="text" id="ch5_title"></div>
            <div class="form-group"><label>Chapter 5 Content</label><textarea id="ch5_content"></textarea></div>
            <div class="form-group"><label>Chapter 6 Title</label><input type="text" id="ch6_title"></div>
            <div class="form-group"><label>Chapter 6 Content</label><textarea id="ch6_content"></textarea></div>
            <div class="form-group"><label>References (one per line)</label><textarea id="proj_refs" placeholder="[1] Author Name, Title..."></textarea></div>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Participants & Image -->
    <div class="collapse-header" onclick="toggleSection(this)">
        <span class="section-label">Attendance &amp; Media</span>
        <span class="arrow">▶</span>
    </div>
    <div class="collapse-body" id="mediaFields">
        <div id="eventAttendance">
            <div class="form-group">
                <label>Participants List (CSV: ID, Name) — Optional</label>
                <textarea id="participantsLog" placeholder="PCE23AD007, Anuj Sharma&#10;PCE23AD010, Aryan..."></textarea>
            </div>
            <div class="form-group">
                <label>Event Image</label>
                <input type="file" accept="image/*" onchange="encodeImageFileAsURL(this, 'image_placeholder')">
                <input type="hidden" id="image_placeholder" value="images/image1.png">
            </div>
        </div>
        <div id="projectPlaceholder" class="hidden">
            <p style="font-size: 11px; color: var(--text-muted);">Media management for projects (e.g. figure uploads) coming soon.</p>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Action Buttons -->
    <div class="actions">
        <button class="btn-action" onclick="renderPreview()">Update Preview</button>
        <button class="btn-action" onclick="printReport()">Print / PDF</button>
        <button class="btn-action" onclick="exportToWord()">Export to Word</button>
    </div>
</div>

<div class="preview">
    <iframe id="reportFrame"></iframe>
</div>

<script>
    let generatedData = {};

    const getVal = (id) => document.getElementById(id).value;
    const setVal = (id, val) => document.getElementById(id).value = val;

    // ── Format Toggle ──
    function selectFormat(btn) {
        document.querySelectorAll('[data-format]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const format = btn.dataset.format;
        setVal('reportFormat', format);

        // Toggle UI Visibility
        document.getElementById('eventInputs').classList.toggle('hidden', format !== 'event_report');
        document.getElementById('projectInputs').classList.toggle('hidden', format !== 'project_report');
        
        // Fields inside collapsed sections
        document.getElementById('eventEditFields').classList.toggle('hidden', format !== 'event_report');
        document.getElementById('projectEditFields').classList.toggle('hidden', format !== 'project_report');
        document.getElementById('eventAttendance').classList.toggle('hidden', format !== 'event_report');
        document.getElementById('projectPlaceholder').classList.toggle('hidden', format !== 'project_report');
        
        // Clear preview on format switch
        const iframe = document.getElementById('reportFrame');
        iframe.contentWindow.document.open();
        iframe.contentWindow.document.write('');
        iframe.contentWindow.document.close();
    }

    // ── Category Toggle ──
    function selectCategory(btn) {
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setVal('eventCategory', btn.dataset.cat);
    }

    // ── Collapse Sections ──
    function toggleSection(header) {
        header.classList.toggle('open');
        const body = header.nextElementSibling;
        if (body.classList.contains('collapse-body')) {
            body.classList.toggle('open');
        }
    }

    // ── Generate ──
    async function generateAll() {
        const apiKey = getVal('apiKey');
        const format = getVal('reportFormat');
        const desc = format === 'event_report' ? getVal('eventDescription') : getVal('projectDescription');
        const btn = document.getElementById('genBtn');
        
        if (!apiKey) { alert('Please enter an API Key first.'); return; }
        if (!desc) { alert('Please enter a description.'); return; }

        btn.disabled = true;
        btn.innerText = 'GENERATING...';

        try {
            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    api_key: apiKey, 
                    description: desc, 
                    event_category: getVal('eventCategory'),
                    report_format: format
                })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            
            generatedData = data;

            if (format === 'event_report') {
                const fields = [
                    'event_name', 'event_date', 'event_duration', 'event_type', 
                    'organized_by', 'coordinators', 'introduction', 'details_of_the_event',
                    'description_of_the_event', 'beneficiaries', 'session_overview', 'conclusion'
                ];
                fields.forEach(f => { if (data[f]) setVal(f, data[f]); });
            } else {
                setVal('proj_title', data.title);
                setVal('proj_type', data.project_type);
                setVal('proj_branch', data.branch);
                setVal('proj_session', data.session);
                setVal('proj_prof', data.professor_name);
                setVal('proj_desig', data.professor_designation);
                setVal('proj_abs_title', data.abstract_title);
                setVal('proj_abs_content', data.abstract_content);
                setVal('proj_keywords', data.keywords);
                setVal('ch1_title', data.chapter_1_title);
                setVal('ch1_content', data.chapter_1_content);
                setVal('ch2_title', data.chapter_2_title);
                setVal('ch2_content', data.chapter_2_content);
                setVal('ch3_title', data.chapter_3_title);
                setVal('ch3_content', data.chapter_3_content);
                setVal('ch4_title', data.chapter_4_title);
                setVal('ch4_content', data.chapter_4_content);
                setVal('ch5_title', data.chapter_5_title);
                setVal('ch5_content', data.chapter_5_content);
                setVal('ch6_title', data.chapter_6_title);
                setVal('ch6_content', data.chapter_6_content);
                setVal('proj_refs', (data.references || []).join('\n'));
                
                // Update student textarea for reference
                const studentsCSV = data.students.map(s => `${s.name}, ${s.reg_no}, ${s.roll_no}`).join('\n');
                setVal('studentDetails', studentsCSV);
            }

            await renderPreview();
            
        } catch (e) {
            alert('Error: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'GENERATE FULL REPORT';
        }
    }

    // ── Parsing ──
    function parseCSV(text) {
        if (!text.trim()) return [];
        return text.split('\n')
            .filter(line => line.includes(','))
            .map(line => {
                const parts = line.split(',').map(p => p.trim());
                if (parts.length === 3) {
                    return { name: parts[0], reg_no: parts[1], roll_no: parts[2] };
                }
                return { roll_no: parts[0], name: parts[1] }; // Fallback for old 2-col format
            });
    }

    // ── Render ──
    async function renderPreview() {
        const format = getVal('reportFormat');
        let data = { report_format: format };

        if (format === 'event_report') {
            Object.assign(data, {
                event_name: getVal('event_name'),
                event_date: getVal('event_date'),
                event_duration: getVal('event_duration'),
                event_type: getVal('event_type'),
                organized_by: getVal('organized_by'),
                coordinators: getVal('coordinators'),
                introduction: getVal('introduction'),
                details_of_the_event: getVal('details_of_the_event'),
                description_of_the_event: getVal('description_of_the_event'),
                beneficiaries: getVal('beneficiaries'),
                session_overview: getVal('session_overview'),
                conclusion: getVal('conclusion'),
                key_highlights: generatedData.key_highlights || [],
                learning_outcome_1: generatedData.learning_outcome_1,
                learning_outcome_2: generatedData.learning_outcome_2,
                learning_outcome_3: generatedData.learning_outcome_3,
                learning_outcome_4: generatedData.learning_outcome_4,
                attendance: parseCSV(getVal('participantsLog')),
                image_placeholder: getVal('image_placeholder') || 'images/placeholder.png'
            });
        } else {
            Object.assign(data, {
                title: getVal('proj_title'),
                project_type: getVal('proj_type'),
                branch: getVal('proj_branch'),
                session: getVal('proj_session'),
                professor_name: getVal('proj_prof'),
                professor_designation: getVal('proj_desig'),
                abstract_title: getVal('proj_abs_title'),
                abstract_content: getVal('proj_abs_content'),
                keywords: getVal('proj_keywords'),
                chapter_1_title: getVal('ch1_title'),
                chapter_1_content: getVal('ch1_content'),
                chapter_2_title: getVal('ch2_title'),
                chapter_2_content: getVal('ch2_content'),
                chapter_3_title: getVal('ch3_title'),
                chapter_3_content: getVal('ch3_content'),
                chapter_4_title: getVal('ch4_title'),
                chapter_4_content: getVal('ch4_content'),
                chapter_5_title: getVal('ch5_title'),
                chapter_5_content: getVal('ch5_content'),
                chapter_6_title: getVal('ch6_title'),
                chapter_6_content: getVal('ch6_content'),
                references: getVal('proj_refs').split('\n').filter(r => r.trim()),
                students: parseCSV(getVal('studentDetails')),
                certificate_students_text: generatedData.certificate_students_text
            });
        }

        try {
            const res = await fetch('/render', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const html = await res.text();
            const iframe = document.getElementById('reportFrame');
            iframe.contentWindow.document.open();
            iframe.contentWindow.document.write(html);
            iframe.contentWindow.document.close();
        } catch (e) {
            console.error(e);
        }
    }

    // ── Print ──
    function printReport() {
        const iframe = document.getElementById('reportFrame');
        const htmlContent = iframe.contentWindow.document.documentElement.outerHTML;
        
        // Open in new tab to prevent iframe PDF corruption (0B file bug)
        const printWindow = window.open('', '_blank');
        
        if (!printWindow) {
            alert('Popup blocked! Please allow popups for this site, or we will try printing directly from the preview.');
            iframe.focus();
            iframe.contentWindow.print();
            return;
        }

        printWindow.document.open();
        printWindow.document.write('<!DOCTYPE html>\n' + htmlContent);
        printWindow.document.close();
        
        // Wait for fonts/images to load then print
        printWindow.setTimeout(() => {
            printWindow.focus();
            printWindow.print();
        }, 500);
    }

    // ── Export to Word ──
    async function exportToWord() {
        const format = getVal('reportFormat');
        let data = { report_format: format };

        // Duplicate logic for data gathering (could be refactored)
        if (format === 'event_report') {
            Object.assign(data, {
                event_name: getVal('event_name'),
                event_date: getVal('event_date'),
                event_duration: getVal('event_duration'),
                event_type: getVal('event_type'),
                organized_by: getVal('organized_by'),
                coordinators: getVal('coordinators'),
                introduction: getVal('introduction'),
                details_of_the_event: getVal('details_of_the_event'),
                description_of_the_event: getVal('description_of_the_event'),
                beneficiaries: getVal('beneficiaries'),
                session_overview: getVal('session_overview'),
                conclusion: getVal('conclusion'),
                key_highlights: generatedData.key_highlights || [],
                learning_outcome_1: generatedData.learning_outcome_1,
                learning_outcome_2: generatedData.learning_outcome_2,
                learning_outcome_3: generatedData.learning_outcome_3,
                learning_outcome_4: generatedData.learning_outcome_4,
                attendance: parseCSV(getVal('participantsLog')),
                image_placeholder: getVal('image_placeholder') || 'images/placeholder.png'
            });
        } else {
            Object.assign(data, {
                title: getVal('proj_title'),
                project_type: getVal('proj_type'),
                branch: getVal('proj_branch'),
                session: getVal('proj_session'),
                professor_name: getVal('proj_prof'),
                professor_designation: getVal('proj_desig'),
                abstract_title: getVal('proj_abs_title'),
                abstract_content: getVal('proj_abs_content'),
                keywords: getVal('proj_keywords'),
                chapter_1_title: getVal('ch1_title'),
                chapter_1_content: getVal('ch1_content'),
                chapter_2_title: getVal('ch2_title'),
                chapter_2_content: getVal('ch2_content'),
                chapter_3_title: getVal('ch3_title'),
                chapter_3_content: getVal('ch3_content'),
                chapter_4_title: getVal('ch4_title'),
                chapter_4_content: getVal('ch4_content'),
                chapter_5_title: getVal('ch5_title'),
                chapter_5_content: getVal('ch5_content'),
                chapter_6_title: getVal('ch6_title'),
                chapter_6_content: getVal('ch6_content'),
                references: getVal('proj_refs').split('\n').filter(r => r.trim()),
                students: parseCSV(getVal('studentDetails')),
                certificate_students_text: generatedData.certificate_students_text
            });
        }

        try {
            const res = await fetch('/export-docx', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if (!res.ok) throw new Error('Export failed');
            
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(format === 'event_report' ? data.event_name : data.title) || 'Report'}.docx`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        } catch (e) {
            alert('Error exporting to Word: ' + e.message);
        }
    }

    // ── Image Encode ──
    function encodeImageFileAsURL(element, targetId) {
        var file = element.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onloadend = function() {
            document.getElementById(targetId).value = reader.result;
            renderPreview();
        }
        reader.readAsDataURL(file);
    }
</script>
